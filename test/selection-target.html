<!doctype html><meta charset="utf-8"><title>Real mouse selection test</title><style>body{margin:0;background:#fafafa;color:#151515;font:28px monospace}#text{position:absolute;left:100px;top:140px;white-space:pre}#note{position:absolute;left:100px;top:60px;font:16px sans-serif}</style><p id="note">Remote uinput → Xorg evdev → Chromium text selection (not injected DOM input)</p><div id="text">Select this text with the remote touchpad.</div><script>window.inputEvents=[];for(const type of ['mousedown','mousemove','mouseup'])document.addEventListener(type,e=>inputEvents.push({type,time:e.timeStamp,x:e.clientX,y:e.clientY,buttons:e.buttons,trusted:e.isTrusted}));</script><style>#click-target{position:absolute;left:100px;top:230px;width:300px;height:60px;font:20px sans-serif}#scroller{position:absolute;left:100px;top:340px;width:600px;height:300px;overflow:auto;border:2px solid #555}#scroller>div{height:3000px;background:repeating-linear-gradient(#dfebff 0 40px,#fff 40px 80px)}</style><button id="click-target">Remote click target</button><div id="scroller"><div>Scroll test content</div></div><script>
window.clickCounts={left:0,right:0};window.frameHeld=false;window.physicalButtons=0;
document.querySelector('#click-target').addEventListener('click',e=>{if(e.isTrusted)clickCounts.left++});
document.querySelector('#click-target').addEventListener('contextmenu',e=>{e.preventDefault();if(e.isTrusted)clickCounts.right++});
document.addEventListener('mousedown',e=>physicalButtons=e.buttons);document.addEventListener('mouseup',e=>physicalButtons=e.buttons);
function sample(){if(physicalButtons)frameHeld=true;requestAnimationFrame(sample)}sample();
</script>
