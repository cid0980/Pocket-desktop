<!doctype html><meta charset="utf-8"><title>Real mouse selection test</title><style>body{margin:0;background:#fafafa;color:#151515;font:28px monospace}#text{position:absolute;left:100px;top:140px;white-space:pre}#note{position:absolute;left:100px;top:60px;font:16px sans-serif}</style><p id="note">Remote uinput → Xorg evdev → Chromium text selection (not injected DOM input)</p><div id="text">Select this text with the remote touchpad.</div><script>window.inputEvents=[];for(const type of ['mousedown','mousemove','mouseup'])document.addEventListener(type,e=>inputEvents.push({type,x:e.clientX,y:e.clientY,buttons:e.buttons,trusted:e.isTrusted}));</script>
